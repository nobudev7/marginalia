services:
  mysql:
    image: mysql:8.4
    container_name: marginalia-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: marginalia
      MYSQL_USER: marginalia_user
      MYSQL_PASSWORD: marginalia_pass
      MYSQL_ROOT_PASSWORD: root_secret_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_dev_data:
