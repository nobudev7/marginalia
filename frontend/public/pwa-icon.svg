<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9" />
      <stop offset="100%" stop-color="#1E467A" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FF" />
      <stop offset="100%" stop-color="#BAE0FD" />
    </linearGradient>
    <filter id="subtleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1F3A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle for PWA icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#subtleShadow)">
    <!-- Pale Blue-White Origin Beacon -->
    <circle cx="144" cy="368" r="38" fill="#F8FBFF" />

    <!-- Arc 1 (inner wave): R=116, 64 deg span -->
    <path d="M 170.1 254.9 A 116 116 0 0 1 257.0 341.9"
          fill="none" stroke="url(#waveGrad)" stroke-width="40" stroke-linecap="round" />

    <!-- Arc 2 (middle wave): R=208, 72 deg span -->
    <path d="M 176.5 162.6 A 208 208 0 0 1 349.4 335.5"
          fill="none" stroke="url(#waveGrad)" stroke-width="40" stroke-linecap="round" />

    <!-- Arc 3 (outer wave): R=296, 80 deg span -->
    <path d="M 169.8 73.1 A 296 296 0 0 1 438.9 342.2"
          fill="none" stroke="url(#waveGrad)" stroke-width="40" stroke-linecap="round" />
  </g>
</svg>
