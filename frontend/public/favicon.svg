<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Warm Paper White Origin Beacon -->
  <circle cx="144" cy="368" r="38" fill="#FAF8F5" />

  <!-- Arc 1 (inner wave): R=116, 64 deg span -->
  <path d="M 170.1 254.9 A 116 116 0 0 1 257.0 341.9"
        fill="none" stroke="url(#goldGrad)" stroke-width="40" stroke-linecap="round" />

  <!-- Arc 2 (middle wave): R=208, 72 deg span -->
  <path d="M 176.5 162.6 A 208 208 0 0 1 349.4 335.5"
        fill="none" stroke="url(#goldGrad)" stroke-width="40" stroke-linecap="round" />

  <!-- Arc 3 (outer wave): R=296, 80 deg span (fits curve of middle arc) -->
  <path d="M 169.8 73.1 A 296 296 0 0 1 438.9 342.2"
        fill="none" stroke="url(#goldGrad)" stroke-width="40" stroke-linecap="round" />
</svg>