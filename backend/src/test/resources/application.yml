spring:
  datasource:
    url: jdbc:h2:mem:marginalia_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-id
            client-secret: test-google-secret
            scope:
              - openid
              - profile
              - email
          github:
            client-id: test-github-id
            client-secret: test-github-secret
            scope:
              - read:user
              - user:email

app:
  crawler:
    interval: 1h
  auth:
    whitelist-emails: "test@example.com"
    dev-mode: true
    session:
      secure-cookie: false


