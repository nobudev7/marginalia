spring:
  datasource:
    url: jdbc:h2:mem:marginalia_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  crawler:
    interval: 1h
  auth:
    whitelist-emails: "test@example.com"

