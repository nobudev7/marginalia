server:
  port: 8080

spring:
  application:
    name: marginalia-backend
  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:marginalia-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:marginalia-google-client-secret}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:marginalia-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:marginalia-github-client-secret}
            scope:
              - read:user
              - user:email

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marginalia}?useSSL=${DB_USE_SSL:true}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY:false}&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:marginalia_user}
    password: ${DB_PASSWORD:marginalia_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  crawler:
    interval: 15m
  auth:
    whitelist-emails: ${AUTH_WHITELIST_EMAILS:}
    dev-mode: ${DEV_MODE:false}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    session:
      secure-cookie: ${SECURE_COOKIE:true}
